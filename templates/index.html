<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Prediksi Kelayakan</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo">Sistem Prediksi Kelayakan</div>
            <nav>
                <ul>
                    <li><a href="/" class="active">Beranda</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <h1>Prediksi Kelayakan Siswa</h1>
            <p>Masukkan data nilai untuk memprediksi kelayakan penerima beasiswa</p>
            
            <form id="prediction-form" action="/predict" method="post">
                <div class="input-grid ">
                    {% for feature in feature_columns %}
                    <div class="form-group" style="margin-right : 20px">
                        <label for="{{ feature }}">{{ feature }}</label>
                        <input type="number" id="{{ feature }}" name="{{ feature }}" min="0" max="100" step="0.1" required>
                    </div>
                    {% endfor %}
                </div>
                
                <div style="text-align: center; margin-top: 30px;">
                    <button type="button" id="quick-fill" style="background-color: #6c757d; margin-right: 10px;">Isi Contoh Data</button>
                    <button type="submit">Prediksi Kelayakan</button>
                </div>
            </form>
        </div>
    </div>

    <footer>
        <div class="container" style="text-align: center; padding: 20px; color: var(--light-text);">
            &copy; 2025 Sistem Prediksi Kelayakan
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
